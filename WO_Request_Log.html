<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>WO Request Log · Vantive DJ Service</title>
<style>
:root{
  --nav-h:64px;
  --plum:#72256B;--plum-d:#5C1B56;--plum-light:rgba(114,37,107,0.09);
  --cream:#FFFAEB;
  --pine:#105742;--pine-light:rgba(16,87,66,0.10);
  --euca:#6CA07A;--euca-light:rgba(108,160,122,0.15);
  --sage:#CDDFD7;
  --amber:#D4700A;--amber-light:rgba(212,112,10,0.10);
  --danger:#C0392B;--danger-light:rgba(192,57,43,0.10);
  --white:#FFFFFF;--text:#1C1C1E;--text2:#52525B;--text3:#A1A1AA;
  --border:rgba(0,0,0,0.07);--border-p:rgba(114,37,107,0.14);
  --shadow:0 2px 14px rgba(0,0,0,0.06);--r:14px;--r-xs:5px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  background:var(--cream);color:var(--text);font-size:14px;min-height:100vh;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--nav-h) + max(env(safe-area-inset-bottom,0px),10px));}

/* ── Header ── */
.hdr{background:linear-gradient(150deg,var(--plum-d) 0%,var(--plum) 60%,#8B3080 100%);
  padding:calc(16px + env(safe-area-inset-top,0px)) 18px 0;
  position:sticky;top:0;z-index:200;overflow:hidden;}
.hdr::after{content:">>>";position:absolute;right:16px;bottom:18px;
  font-size:22px;font-weight:900;color:rgba(255,250,235,0.10);letter-spacing:-2px;
  font-family:"Arial Black",Arial,sans-serif;}
.hdr-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px;position:relative;z-index:2;}
.wmark-wrap{display:flex;flex-direction:column;gap:4px;}
.wmark-img{height:26px;width:auto;max-width:100px;display:block;}
.tagline{font-size:12px;font-weight:700;color:rgba(255,250,235,0.55);letter-spacing:1.8px;text-transform:uppercase;font-family:"Arial Black",Arial,sans-serif;}
.total-badge{background:rgba(255,250,235,0.18);border:1px solid rgba(255,250,235,0.25);
  color:var(--cream);font-size:11px;font-weight:700;padding:5px 13px;border-radius:20px;flex-shrink:0;margin-top:2px;}
.s-wrap{position:relative;margin-bottom:10px;z-index:2;}
.s-ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);pointer-events:none;}
.s-inp{width:100%;padding:12px 42px 12px 44px;background:rgba(255,250,235,0.13);
  border:1.5px solid rgba(255,250,235,0.22);border-radius:12px;font-size:14px;
  color:var(--cream);outline:none;font-family:inherit;transition:background .18s,border-color .18s;}
.s-inp:focus{background:rgba(255,250,235,0.22);border-color:rgba(255,250,235,0.45);}
.s-inp::placeholder{color:rgba(255,250,235,0.45);}
.s-clr{position:absolute;right:10px;top:50%;transform:translateY(-50%);
  background:rgba(255,250,235,0.22);border:none;border-radius:50%;
  width:22px;height:22px;font-size:12px;cursor:pointer;color:var(--cream);
  font-weight:700;display:none;line-height:22px;text-align:center;}
.s-clr.show{display:block;}
.s-hint{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding-bottom:12px;
  font-size:11px;color:rgba(255,250,235,0.58);position:relative;z-index:2;}
.h-arr{color:rgba(255,250,235,0.75);font-weight:900;letter-spacing:-2px;font-family:"Arial Black",Arial,sans-serif;}
.h-ex{background:rgba(255,250,235,0.14);border:1px solid rgba(255,250,235,0.18);
  color:rgba(255,250,235,0.9);border-radius:4px;padding:2px 8px;font-size:11px;font-weight:600;}

/* ── Filters ── */
.filt{background:var(--cream);padding:10px 16px;border-bottom:1px solid var(--border);}
.flbl{font-size:11px;font-weight:800;color:var(--pine);letter-spacing:1.2px;text-transform:uppercase;margin-bottom:6px;font-family:"Arial Black",Arial,sans-serif;display:flex;align-items:center;gap:5px;}
.seg-row{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;}
.seg-row::-webkit-scrollbar{display:none;}
.seg{flex-shrink:0;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;
  cursor:pointer;user-select:none;white-space:nowrap;background:rgba(0,0,0,0.05);color:var(--text2);
  border:1.5px solid transparent;transition:all .15s ease;font-family:inherit;display:inline-flex;align-items:center;}
.seg.on{background:var(--plum);color:var(--cream);border-color:var(--plum);}
.seg:active{transform:scale(0.95);}
.frow{margin-bottom:8px;}.frow:last-child{margin-bottom:0;}

/* ── Status bar ── */
.sbar{padding:7px 18px 5px;font-size:12px;color:var(--text2);background:var(--cream);}
.sbar b{color:var(--plum);font-weight:700;}

/* ── Cards ── */
.cards{padding:8px 14px 24px;display:flex;flex-direction:column;gap:8px;}
.card{background:var(--white);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--border);overflow:hidden;}
.chead{display:flex;align-items:flex-start;gap:10px;padding:12px 13px 10px;cursor:pointer;}
.wo-num{display:inline-flex;align-items:center;justify-content:center;
  min-width:38px;padding:3px 7px;border-radius:var(--r-xs);font-size:11px;font-weight:800;
  white-space:nowrap;flex-shrink:0;margin-top:2px;
  font-family:monospace;background:var(--plum-light);color:var(--plum);border:1px solid var(--border-p);}
.cbody{flex:1;min-width:0;}
.ctitle{font-size:13.5px;font-weight:700;line-height:1.4;margin-bottom:5px;color:var(--text);}
.cmeta{display:flex;flex-wrap:wrap;gap:4px;align-items:center;}
.chev{color:var(--text3);flex-shrink:0;margin-top:2px;width:22px;height:22px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,0.04);border-radius:50%;transition:transform .25s ease,background .15s;}
.chev.open{transform:rotate(180deg);background:var(--plum-light);color:var(--plum);}

/* Badges */
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;text-transform:uppercase;}
.b-acc{background:var(--plum-light);color:var(--plum);border:1px solid var(--border-p);}
.b-repair{background:var(--danger-light);color:var(--danger);}
.b-fch{background:var(--amber-light);color:var(--amber);}
.b-pm{background:var(--pine-light);color:var(--pine);}
.b-pm2{background:#d0eae3;color:#0a5c3a;}
.b-basekit{background:#e8d5f0;color:#5a1f70;}
.b-install{background:var(--euca-light);color:#0a6b4e;}
.b-other{background:rgba(0,0,0,0.05);color:var(--text3);}
.b-date{background:rgba(0,0,0,0.04);color:var(--text3);font-family:monospace;font-size:10px;}

/* ── Detail Panel ── */
.cdet{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1);}
.cdet.open{max-height:600px;border-top:1px solid var(--border);}
.cdet-in{padding:14px 13px 16px;background:rgba(255,250,235,0.5);}
.drow{display:flex;gap:8px;margin-bottom:9px;align-items:flex-start;}
.drow:last-child{margin-bottom:0;}
.dlbl{font-size:9px;font-weight:800;color:var(--pine);letter-spacing:1.2px;text-transform:uppercase;
  min-width:80px;flex-shrink:0;padding-top:2px;font-family:"Arial Black",Arial,sans-serif;}
.dval{font-size:13px;color:var(--text);line-height:1.55;word-break:break-word;}
.dval.highlight{background:var(--plum-light);color:var(--plum);
  border-radius:6px;padding:5px 9px;font-weight:600;font-family:monospace;}
.divider-arrow{display:flex;align-items:center;gap:6px;margin:10px 0 8px;}
.divider-arrow::before,.divider-arrow::after{content:"";flex:1;height:1px;background:var(--border);}
.divider-arrow span{font-size:10px;color:var(--text3);font-weight:700;letter-spacing:1px;text-transform:uppercase;}

/* ── Empty ── */
.empty{text-align:center;padding:60px 24px;color:var(--text2);display:none;}
.empty-ico{font-size:46px;margin-bottom:12px;opacity:.4;}
.empty h3{font-size:17px;font-weight:700;margin-bottom:6px;}
.empty p{font-size:13px;}

/* ── Stats Panel ── */
.stats-panel{padding:16px 14px 24px;}
.stat-section{margin-bottom:20px;}
.stat-hdr{font-size:12px;font-weight:800;color:var(--pine);letter-spacing:0.8px;
  text-transform:uppercase;margin-bottom:10px;padding-bottom:8px;
  border-bottom:2px solid var(--euca-light);
  font-family:"Arial Black",Arial,sans-serif;display:flex;align-items:center;gap:6px;}
.stat-hdr svg{width:14px;height:14px;flex-shrink:0;stroke:var(--pine);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.stat-card{background:var(--white);border-radius:var(--r);box-shadow:var(--shadow);
  border:1px solid var(--border);padding:16px 18px;margin-bottom:10px;}
.stat-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.stat-row:last-child{margin-bottom:0;}
.stat-name{font-size:13px;font-weight:700;color:var(--text);min-width:70px;}
.stat-bar-wrap{flex:1;height:22px;background:rgba(0,0,0,0.04);border-radius:4px;overflow:hidden;}
.stat-bar{height:100%;border-radius:4px;transition:width .6s cubic-bezier(.4,0,.2,1);display:flex;align-items:center;padding-left:8px;}
.stat-bar span{font-size:11px;font-weight:700;color:rgba(255,255,255,0.9);}
.stat-cnt{font-size:13px;font-weight:800;min-width:36px;text-align:right;font-family:monospace;}
.stat-pct{font-size:11px;color:var(--text3);min-width:38px;text-align:right;}

/* Monthly table */
.mo-table{width:100%;border-collapse:collapse;}
.mo-table th{font-size:9px;font-weight:800;color:var(--pine);letter-spacing:1px;
  text-transform:uppercase;padding:6px 8px;border-bottom:1.5px solid var(--border);
  text-align:left;font-family:"Arial Black",Arial,sans-serif;}
.mo-table td{font-size:12px;padding:7px 8px;border-bottom:1px solid var(--border);color:var(--text2);}
.mo-table td:first-child{font-weight:700;color:var(--text);font-family:monospace;}
.mo-table tr:last-child td{border-bottom:none;}
.mo-cell{display:inline-block;padding:2px 7px;border-radius:4px;font-weight:700;font-size:11px;text-align:center;min-width:30px;}

/* Summary kpi cards */
.kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
.kpi{background:var(--white);border-radius:12px;box-shadow:var(--shadow);
  border:1px solid var(--border);padding:14px 12px;text-align:center;}
.kpi-val{font-size:26px;font-weight:900;color:var(--plum);line-height:1;margin-bottom:4px;
  font-family:"Arial Black",Arial,sans-serif;}
.kpi-lbl{font-size:10px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.8px;}

/* ── Bottom Nav ── */
.bnav{position:fixed;bottom:0;left:0;right:0;min-height:var(--nav-h);
  background:#B5CFBC;border-top:1.5px solid rgba(114,37,107,0.18);
  display:flex;align-items:flex-start;padding-top:10px;
  padding-bottom:max(env(safe-area-inset-bottom,0px),10px);z-index:200;}
.bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:3px 4px;cursor:pointer;border:none;background:none;font-family:inherit;
  -webkit-tap-highlight-color:transparent;}
.bnav-svg{width:22px;height:22px;color:rgba(114,37,107,0.4);transition:color .15s,transform .18s cubic-bezier(.34,1.56,.64,1);}
.bnav-label{font-size:9px;font-weight:800;color:rgba(114,37,107,0.5);
  font-family:"Arial Black",Arial,sans-serif;letter-spacing:.4px;text-transform:uppercase;}
.bnav-item.on .bnav-svg{color:var(--plum);transform:scale(1.12);}
.bnav-item.on .bnav-label{color:var(--plum);}
.bnav-item:active .bnav-svg{transform:scale(0.88);}
.tab-panel{display:none;}.tab-panel.on{display:block;}


/* ── Month filter chips ── */
.mo-filter-row{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;}
.mo-filter-row::-webkit-scrollbar{display:none;}
.mo-chip{flex-shrink:0;padding:4px 11px;border-radius:20px;font-size:11.5px;font-weight:700;
  cursor:pointer;user-select:none;white-space:nowrap;background:rgba(0,0,0,0.05);color:var(--text2);
  border:1.5px solid transparent;transition:all .15s;font-family:inherit;}
.mo-chip.on{background:var(--pine);color:var(--cream);border-color:var(--pine);}
.mo-chip:active{transform:scale(0.95);}

/* ── Paging ── */
.paging{display:flex;align-items:center;justify-content:center;gap:5px;
  padding:10px 14px 6px;}
.pg-btn{min-width:34px;height:34px;border-radius:8px;border:1.5px solid var(--border);
  background:var(--white);color:var(--text2);font-size:13px;font-weight:600;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-family:inherit;transition:all .15s;}
.pg-btn.on{background:var(--plum);color:var(--cream);border-color:var(--plum);}
.pg-btn:disabled{opacity:.35;cursor:default;}
.pg-btn:not(.on):not(:disabled):hover{background:var(--plum-light);border-color:var(--border-p);}
.pg-info{font-size:12px;color:var(--text3);padding:0 6px;}
.pg-dots{font-size:13px;color:var(--text3);padding:0 2px;}

/* ── Stats month accordion ── */
.mo-acc{border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:8px;background:var(--white);}
.mo-acc-head{display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;cursor:pointer;user-select:none;transition:background .12s;}
.mo-acc-head:hover{background:var(--plum-light);}
.mo-acc-ym{font-size:14px;font-weight:800;color:var(--plum);font-family:"Arial Black",Arial,sans-serif;letter-spacing:.5px;}
.mo-acc-meta{display:flex;align-items:center;gap:8px;}
.mo-acc-cnt{font-size:12px;color:var(--text3);}
.mo-acc-chev{font-size:14px;color:var(--text3);transition:transform .25s;}
.mo-acc-chev.open{transform:rotate(180deg);}
.mo-acc-body{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1);}
.mo-acc-body.open{max-height:800px;}
.mo-acc-in{padding:12px 16px 16px;border-top:1px solid var(--border);background:rgba(255,250,235,0.4);}
.mo-sub-hdr{font-size:9px;font-weight:800;color:var(--pine);letter-spacing:1.4px;
  text-transform:uppercase;margin:10px 0 7px;font-family:"Arial Black",Arial,sans-serif;}
.mo-sub-hdr:first-child{margin-top:0;}
.mo-stat-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
.mo-stat-row:last-child{margin-bottom:0;}
.mo-stat-name{font-size:12px;font-weight:600;color:var(--text);min-width:70px;}
.mo-bar-wrap{flex:1;height:18px;background:rgba(0,0,0,0.04);border-radius:3px;overflow:hidden;}
.mo-bar{height:100%;border-radius:3px;display:flex;align-items:center;padding-left:6px;transition:width .5s ease;}
.mo-bar span{font-size:10px;font-weight:700;color:rgba(255,255,255,0.9);}
.mo-stat-cnt{font-size:12px;font-weight:800;min-width:28px;text-align:right;font-family:monospace;}
.mo-stat-pct{font-size:11px;color:var(--text3);min-width:38px;text-align:right;}

mark{background:rgba(114,37,107,0.13);color:var(--plum);border-radius:2px;padding:0 1px;}

/* ── By Customer Table ── */
.cust-panel{padding:14px 0 100px;}
.cust-top{padding:0 14px 10px;}
.cust-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.cust-table{border-collapse:collapse;font-size:12px;width:100%;}
.cust-table th{
  padding:8px 10px;font-size:10px;font-weight:800;letter-spacing:0.6px;
  text-transform:uppercase;white-space:nowrap;text-align:center;
  background:var(--sage,#CDDFD7);color:var(--pine);border-bottom:2px solid rgba(16,87,66,0.25);
  font-family:"Arial Black",Arial,sans-serif;position:sticky;top:0;z-index:2;}
.cust-table th.th-fix{position:sticky;left:0;z-index:3;text-align:left;}
.cust-table td{
  padding:7px 10px;border-bottom:1px solid var(--border);
  text-align:center;background:var(--white);vertical-align:middle;}
.cust-table td.td-fix{
  position:sticky;left:0;z-index:1;background:var(--white);
  text-align:left;font-weight:600;color:var(--text);
  white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis;}
/* Manager header row */
.cust-acc td{font-weight:800;font-size:12px;letter-spacing:0.3px;
  font-family:"Arial Black",Arial,sans-serif;color:#fff;border-bottom:none;}
.cust-acc td.td-fix{color:#fff;}
/* Subtotal row */
.cust-sub td{font-weight:700;font-size:12px;border-top:1.5px solid rgba(0,0,0,0.12);}
/* Grand total row */
.cust-grand td{background:var(--plum-light)!important;color:var(--plum)!important;
  font-weight:800;font-size:13px;border-top:2px solid var(--plum);
  font-family:"Arial Black",Arial,sans-serif;}
/* Number cells */
.cn{font-family:monospace;font-weight:700;}
.cn.z{color:#ccc;font-weight:400;}
.cn.t{color:var(--plum);font-weight:800;}
/* Kpi strip */
.cust-kpi{display:flex;gap:8px;padding:0 14px 12px;overflow-x:auto;scrollbar-width:none;}
.cust-kpi::-webkit-scrollbar{display:none;}
.ck{background:var(--white);border:1px solid var(--border);border-radius:12px;
  padding:10px 14px;text-align:center;flex-shrink:0;min-width:80px;box-shadow:var(--shadow);}
.ck-v{font-size:20px;font-weight:900;color:var(--plum);font-family:"Arial Black",Arial,sans-serif;line-height:1;}
.ck-l{font-size:9px;color:var(--text3);font-weight:600;text-transform:uppercase;margin-top:3px;}

/* ── Charts ── */
.chart-section{margin-bottom:14px;}
.chart-hdr{font-size:11px;font-weight:800;color:var(--pine);letter-spacing:0.8px;
  text-transform:uppercase;margin-bottom:8px;font-family:"Arial Black",Arial,sans-serif;display:flex;align-items:center;gap:5px;}
.chart-hdr svg{width:13px;height:13px;flex-shrink:0;stroke:var(--pine);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.chart-card{background:var(--white);border-radius:var(--r);box-shadow:var(--shadow);
  border:1px solid var(--border);padding:14px 14px 10px;}
.chart-scroll{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
.chart-scroll::-webkit-scrollbar{display:none;}
.donut-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.donut-card{background:var(--white);border-radius:var(--r);box-shadow:var(--shadow);
  border:1px solid var(--border);padding:12px 10px 12px;text-align:center;}
.donut-title{font-size:11px;font-weight:800;color:var(--pine);letter-spacing:0.8px;
  text-transform:uppercase;margin-bottom:10px;font-family:"Arial Black",Arial,sans-serif;}
.donut-legend{display:flex;flex-direction:column;gap:4px;margin-top:10px;text-align:left;}
.donut-leg-row{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--text2);}
.donut-leg-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.donut-leg-name{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.donut-leg-cnt{font-family:monospace;font-weight:700;color:var(--text);}
</style>
</head>
<body>

<!-- Header -->
<div class="hdr">

var SQ='', AF='all', TF='all', MF='all', OS={}, CUR_PAGE=1, PAGE_SIZE=20, FILTERED_LIST=[];

document.getElementById('totalBadge').textContent = WO.length + ' WOs';

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function hi(s,ws){
  if(!ws||!ws.length) return esc(s);
  var r=esc(s);
  ws.forEach(function(w){
    if(!w) return;
    r=r.replace(new RegExp('('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>');
  });
  return r;
}

function typeBadge(t){
  if(!t||t.toLowerCase()==='n/a') return '';
  var tl = t.toLowerCase();
  var cls = 'b-other';
  if(tl==='repair') cls='b-repair';
  else if(tl.indexOf('fch')>=0) cls='b-fch';
  else if(tl.indexOf('pm2')>=0) cls='b-pm2';
  else if(tl.indexOf('base kit')>=0) cls='b-basekit';
  else if(tl.indexOf('pm')>=0) cls='b-pm';
  else if(tl.indexOf('install')>=0||tl.indexOf('설치')>=0) cls='b-install';
  return '<span class="badge '+cls+'">'+esc(t)+'</span>';
}

function accBadge(a){
  if(!a) return '<span class="badge b-other">미입력</span>';
  return '<span class="badge b-acc">'+esc(a)+'</span>';
}

function fmtDate(dt){
  if(!dt) return '';
  return dt.substring(0,10);
}
function fmtTime(dt){
  if(!dt) return '';
  return dt.substring(11,16);
}

function renderPage(){
  var ws = SQ ? SQ.trim().toLowerCase().split(/\s+/) : [];
  var list = FILTERED_LIST;
  var cardsEl = document.getElementById('cardsEl');
  var emptyEl = document.getElementById('emptyEl');
  var sbar = document.getElementById('sbarEl');
  var pagingEl = document.getElementById('pagingEl');

  if(!list.length){
    cardsEl.innerHTML='';cardsEl.style.display='none';
    emptyEl.style.display='block';pagingEl.style.display='none';
    sbar.innerHTML='검색 결과 없음';
    return;
  }
  cardsEl.style.display='';emptyEl.style.display='none';

  var total = list.length;
  var totalPages = Math.ceil(total / PAGE_SIZE);
  if(CUR_PAGE > totalPages) CUR_PAGE = totalPages;
  var start = (CUR_PAGE-1)*PAGE_SIZE;
  var pageItems = list.slice(start, start+PAGE_SIZE);

  var filterActive = SQ||AF!=='all'||TF!=='all'||MF!=='all';
  sbar.innerHTML = filterActive
    ? '<b>'+total+'</b>건 검색됨 (전체 '+WO.length+'건) · '+CUR_PAGE+'/'+totalPages+'페이지'
    : '전체 <b>'+WO.length+'</b>건 · '+CUR_PAGE+'/'+totalPages+'페이지';

  cardsEl.innerHTML = pageItems.map(function(w, pi){
    var realIdx = start + pi;
    var key = 'w'+realIdx;
    var isOpen = OS[key];
    var hasSerial = w.sn && w.sn.toLowerCase()!=='n/a';
    var hasFault  = w.fault && w.fault.toLowerCase()!=='n/a';

    return '<div class="card">'+
      '<div class="chead" onclick="toggle(\''+key+'\')">'+
        '<span class="wo-num">'+esc(String(realIdx+1).padStart(3,'0'))+'</span>'+
        '<div class="cbody">'+
          '<div class="ctitle">'+hi(w.acct||'(거래처 미입력)',ws)+' <span style="font-weight:400;color:var(--text3)">·</span> '+hi(w.dev||'—',ws)+'</div>'+
          '<div class="cmeta">'+
            accBadge(w.acc)+
            typeBadge(w.typ)+
            '<span class="badge b-date">'+esc(fmtDate(w.dt))+' '+esc(fmtTime(w.dt))+'</span>'+
            (hasSerial ? '<span class="badge" style="background:var(--euca-light);color:var(--pine);font-family:monospace;">'+esc(w.sn)+'</span>' : '')+
          '</div>'+
        '</div>'+
        '<div class="chev'+(isOpen?' open':'')+'" id="chev_'+key+'">▾</div>'+
      '</div>'+
      '<div class="cdet'+(isOpen?' open':'')+'" id="det_'+key+'">'+
        '<div class="cdet-in">'+
          '<div class="drow"><span class="dlbl">접수자</span><span class="dval">'+hi(w.acc||'—',ws)+'</span></div>'+
          '<div class="drow"><span class="dlbl">발생시간</span><span class="dval">'+esc(fmtDate(w.dt))+' '+esc(w.time&&w.time!=='n/a'?w.time:fmtTime(w.dt))+'</span></div>'+
          '<div class="drow"><span class="dlbl">거래처</span><span class="dval">'+hi(w.acct||'—',ws)+'</span></div>'+
          '<div class="drow"><span class="dlbl">점검유형</span><span class="dval">'+esc(w.typ||'—')+'</span></div>'+
          '<div class="drow"><span class="dlbl">장비명</span><span class="dval">'+hi(w.dev||'—',ws)+'</span></div>'+
          (hasFault ? '<div class="drow"><span class="dlbl">고장내용</span><span class="dval">'+hi(w.fault,ws)+'</span></div>' : '')+
          (w.mode&&w.mode!=='n/a' ? '<div class="drow"><span class="dlbl">고장모드</span><span class="dval">'+esc(w.mode)+'</span></div>' : '')+
          (w.note&&w.note!=='n/a' ? '<div class="drow"><span class="dlbl">전달사항</span><span class="dval">'+hi(w.note,ws)+'</span></div>' : '')+
          (hasSerial ? '<div class="divider-arrow"><span>Serial No.</span></div><div class="drow"><span class="dval highlight">'+hi(w.sn,ws)+'</span></div>' : '')+
          (w.wo ? '<div class="divider-arrow"><span>WO No.</span></div><div class="drow"><span class="dval highlight" style="font-size:12px;word-break:break-all;">'+esc(w.wo)+'</span></div>' : '')+
        '</div>'+
      '</div>'+
    '</div>';
  }).join('');

  // Paging controls
  if(totalPages <= 1){ pagingEl.style.display='none'; return; }
  pagingEl.style.display='flex';
  var pg = '';
  pg += '<button class="pg-btn" onclick="goPage('+(CUR_PAGE-1)+')" '+(CUR_PAGE<=1?'disabled':'')+'>‹</button>';
  var pages = [];
  if(totalPages <= 7){
    for(var i=1;i<=totalPages;i++) pages.push(i);
  } else {
    pages.push(1);
    if(CUR_PAGE > 3) pages.push('…');
    for(var i=Math.max(2,CUR_PAGE-1);i<=Math.min(totalPages-1,CUR_PAGE+1);i++) pages.push(i);
    if(CUR_PAGE < totalPages-2) pages.push('…');
    pages.push(totalPages);
  }
  pages.forEach(function(p){
    if(p==='…'){ pg += '<span class="pg-dots">…</span>'; }
    else { pg += '<button class="pg-btn'+(p===CUR_PAGE?' on':'')+'" onclick="goPage('+p+')">'+p+'</button>'; }
  });
  pg += '<button class="pg-btn" onclick="goPage('+(CUR_PAGE+1)+')" '+(CUR_PAGE>=totalPages?'disabled':'')+'>›</button>';
  pagingEl.innerHTML = pg;
}

function goPage(p){
  var totalPages = Math.ceil(FILTERED_LIST.length / PAGE_SIZE);
  if(p<1||p>totalPages) return;
  CUR_PAGE = p;
  OS = {};
  renderPage();
  document.getElementById('cardsEl').closest('.tab-panel').scrollIntoView({behavior:'smooth',block:'start'});
  window.scrollTo({top:0,behavior:'smooth'});
}

function render(list){ renderPage(); }

function toggle(key){
  var det=document.getElementById('det_'+key);
  var chev=document.getElementById('chev_'+key);
  if(!det) return;
  if(OS[key]){OS[key]=0;det.classList.remove('open');if(chev)chev.classList.remove('open');}
  else{OS[key]=1;det.classList.add('open');if(chev)chev.classList.add('open');}
}

function go(){
  var ws = SQ ? SQ.trim().toLowerCase().split(/\s+/) : [];
  var list = WO.slice().reverse(); // newest first
  if(YF!=='all' && MF==='all') list=list.filter(function(w){ return w.dt.substring(0,4)===YF; });
  if(MF!=='all') list=list.filter(function(w){ return w.dt.substring(0,7)===MF; });
  if(AF!=='all') list=list.filter(function(w){ return w.acc===AF; });
  if(TF!=='all'){
    list=list.filter(function(w){
      var t=(w.typ||'').toLowerCase();
      if(TF==='repair') return t==='repair';
      if(TF==='fch') return t.indexOf('fch')>=0;
      if(TF==='pm2') return t.indexOf('pm2')>=0;
      if(TF==='basekit') return t.indexOf('base kit')>=0;
      if(TF==='pm') return t==='pm'||t==='pm '||t.trim()==='pm';
      if(TF==='install') return t.indexOf('install')>=0||t.indexOf('설치')>=0;
      return true;
    });
  }
  if(ws.length){
    list=list.filter(function(w){
      var h=[w.acct,w.dev,w.fault,w.note,w.sn,w.acc,w.typ].join(' ').toLowerCase();
      return ws.every(function(ww){ return h.indexOf(ww)>=0; });
    });
  }
  FILTERED_LIST = list;
  CUR_PAGE = 1;
  OS={};
  renderPage();
}

var YF = 'all'; // selected year
(function initYearMonth(){
  // Build year→months map from data
  var ymMap = {}; // { '2025': ['2025-08','2025-09',...], '2026': [...] }
  WO.forEach(function(w){
    var ym = w.dt.substring(0,7);
    var y  = ym.substring(0,4);
    if(!ymMap[y]) ymMap[y] = {};
    ymMap[y][ym] = 1;
  });
  var years = Object.keys(ymMap).sort().reverse();

  // Populate year buttons
  var yrRow = document.getElementById('yrRow');
  years.forEach(function(y){
    var b = document.createElement('button');
    b.className = 'mo-chip';
    b.setAttribute('data-v', y);
    b.textContent = y + '년';
    yrRow.appendChild(b);
  });

  // Year row click → show months for that year
  yrRow.addEventListener('click', function(e){
    var b = e.target; while(b && !b.classList.contains('mo-chip')) b = b.parentElement;
    if(!b) return;
    document.querySelectorAll('#yrRow .mo-chip').forEach(function(x){x.classList.remove('on');});

/* ── Canvas chart helpers ── */
function initCanvas(id, w, h){
  var c=document.getElementById(id);
  if(!c) return null;
  var dpr=window.devicePixelRatio||1;
  c.width=w*dpr; c.height=h*dpr;
  c.style.width=w+'px'; c.style.height=h+'px';
  var ctx=c.getContext('2d');
  ctx.scale(dpr,dpr);
  return ctx;
}

function drawTrendChart(moData){
  var months=Object.keys(moData).sort();
  var wrap=document.getElementById('trendWrap');
  if(!wrap) return;
  var colW=Math.max(52, Math.floor((wrap.offsetWidth||320)/months.length));
  var W=Math.max(colW*months.length, wrap.offsetWidth||320);
  var H=200;
  var ctx=initCanvas('trendChart',W,H);
  if(!ctx) return;

  var PL=38,PR=10,PT=28,PB=56;
  var cW=W-PL-PR, cH=H-PT-PB;
  var maxV=Math.max.apply(null,months.map(function(m){return moData[m].total;}))||1;
  var niceMax=Math.ceil(maxV/5)*5||5;

  // grid
  ctx.strokeStyle='rgba(0,0,0,0.06)'; ctx.lineWidth=0.8;
  for(var g=0;g<=4;g++){
    var gy=PT+cH*(1-g/4);
    ctx.beginPath(); ctx.moveTo(PL,gy); ctx.lineTo(PL+cW,gy); ctx.stroke();
    ctx.fillStyle='#bbb'; ctx.font='11px Arial'; ctx.textAlign='right';
    ctx.fillText(Math.round(niceMax*g/4),PL-4,gy+4);
  }

  var bW=cW/months.length, bPad=Math.max(bW*0.2,4), abW=bW-bPad*2;
  var prevYear='';
  months.forEach(function(ym,i){
    var val=moData[ym].total;
    var bH=(val/niceMax)*cH;
    var x=PL+i*bW+bPad;
    var y=PT+cH-bH;
    var parts=ym.split('-');

    // bar
    ctx.fillStyle='rgba(114,37,107,0.82)';
    ctx.fillRect(x,y,abW,bH);

    // value
    ctx.textAlign='center';
    if(bH>22){
      ctx.fillStyle='rgba(255,255,255,0.95)'; ctx.font='bold 18px Arial';
      ctx.fillText(val,x+abW/2,y+16);
    } else {
      ctx.fillStyle='#72256B'; ctx.font='bold 18px Arial';
      ctx.fillText(val,x+abW/2,y-5);
    }

    // month label
    ctx.fillStyle='#999'; ctx.font='18px Arial';
    ctx.fillText(parts[1]+'월',x+abW/2,PT+cH+20);

    // year label (on change)
    if(parts[0]!==prevYear){
      prevYear=parts[0];
      ctx.fillStyle='rgba(114,37,107,0.75)'; ctx.font='bold 16px Arial';
      ctx.textAlign='left';
      ctx.fillText(parts[0],x,PT+cH+42);
    }
  });

  // axes
  ctx.strokeStyle='rgba(0,0,0,0.12)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(PL,PT); ctx.lineTo(PL,PT+cH); ctx.lineTo(PL+cW,PT+cH); ctx.stroke();
}

function drawDonut(id, dataMap, colorMap){
  var size=110;
  var ctx=initCanvas(id,size,size);
  if(!ctx) return;
  var cx=size/2, cy=size/2;
  var outerR=size/2-6, innerR=outerR*0.56;
  var keys=Object.keys(dataMap).filter(function(k){return dataMap[k]>0;});
  var total=keys.reduce(function(s,k){return s+dataMap[k];},0);
  if(!total) return;

  var gap=keys.length>1?0.03:0;
  var startA=-Math.PI/2;
  keys.forEach(function(k){
    var angle=(dataMap[k]/total)*(Math.PI*2-gap*keys.length);
    ctx.beginPath();
    ctx.arc(cx,cy,outerR,startA,startA+angle);
    ctx.arc(cx,cy,innerR,startA+angle,startA,true);
    ctx.closePath();
    ctx.fillStyle=colorMap[k]||'#A1A1AA';
    ctx.fill();
    startA+=angle+gap;
  });

  // hole fill
  ctx.beginPath(); ctx.arc(cx,cy,innerR,0,Math.PI*2);
  ctx.fillStyle='#fff'; ctx.fill();

  // center text
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='#72256B'; ctx.font='bold 16px "Arial Black",Arial';
  ctx.fillText(total,cx,cy-6);
  ctx.fillStyle='#aaa'; ctx.font='9px Arial';
  ctx.fillText('건',cx,cy+9);
}

function buildBars(dataMap, total, colors, nameWidth){
  var keys = Object.keys(dataMap).sort(function(a,b){return dataMap[b]-dataMap[a];});
  var maxVal = dataMap[keys[0]] || 1;
  var html = '';
  keys.forEach(function(k,i){
    var cnt = dataMap[k];
    var pct = (cnt/total*100).toFixed(1);
    var barW = Math.round(cnt/maxVal*100);
    var col = Array.isArray(colors) ? colors[i%colors.length] : (colors[k]||'#A1A1AA');
    html += '<div class="mo-stat-row">'+
      '<span class="mo-stat-name" style="min-width:'+(nameWidth||70)+'px;">'+esc(k)+'</span>'+
      '<div class="mo-bar-wrap"><div class="mo-bar" style="width:'+barW+'%;background:'+col+'"><span>'+cnt+'</span></div></div>'+
      '<span class="mo-stat-cnt" style="color:'+col+'">'+cnt+'</span>'+
      '<span class="mo-stat-pct">'+pct+'%</span>'+
    '</div>';
  });
  return html;
}

      html+='<td><span class="cn'+(n===0?' z':'')+'" style="color:'+col+'">'+( n===0?'-':n)+'</span></td>';
    });
    html+='<td><span class="cn t" style="color:'+col+'">'+m.subT+'</span></td>';
    html+='</tr>';

    // Except Warmer row
    // Groupings: Renal(span4)=ew[0], PRISMA_A(span2)=ew[1], PRISMA_B(span3)=ew[2], Warmers(span3)=ew[3], Total
    var ewStyle='background:#F5F0FA;color:#5a1f70;font-weight:700;font-size:11px;';
    html+='<tr style="'+ewStyle+'">';
    html+='<td class="td-fix" style="background:#F5F0FA;color:#5a1f70;font-size:11px;font-weight:700;font-style:italic;">Except Warmer</td>';
    html+='<td colspan="4" style="text-align:center;'+ewStyle+'"><span class="cn">'+m.ew[0]+'</span></td>';
    html+='<td colspan="2" style="text-align:center;'+ewStyle+'"><span class="cn">'+m.ew[1]+'</span></td>';
    html+='<td colspan="3" style="text-align:center;'+ewStyle+'"><span class="cn">'+m.ew[2]+'</span></td>';
    html+='<td colspan="3" style="text-align:center;'+ewStyle+'"><span class="cn z">-</span></td>';
    html+='<td style="'+ewStyle+'"><span class="cn t" style="color:#5a1f70;">'+m.ewT+'</span></td>';
    html+='</tr>';
  });

  html+='</tbody></table></div>';
  el.innerHTML=html;
}

function switchTab(tab, el){
  document.querySelectorAll('.bnav-item').forEach(function(b){b.classList.remove('on');});
  if(el) el.classList.add('on');
  var isSearch = tab==='search';
  document.getElementById('filtEl').style.display = isSearch ? '' : 'none';
  document.getElementById('sbarEl').style.display = isSearch ? '' : 'none';
  document.getElementById('searchPanel').classList.toggle('on', isSearch);
  document.getElementById('statsPanel').classList.toggle('on', tab==='stats');
  document.getElementById('custPanel').classList.toggle('on', tab==='customer');
  if(tab==='stats') renderStats();
  if(tab==='customer') renderCustomer();
  if(isSearch) go();
}

go();
</script>
</body>
</html>
