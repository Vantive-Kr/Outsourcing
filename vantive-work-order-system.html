<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vantive 외주작업 관리 시스템</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ── Reset ── */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Arial','Noto Sans KR',-apple-system,sans-serif;font-size:14px;color:#1a0d18;display:flex;background:#FFFAEB}

/* ── Brand Variables ── */
:root{
  --plum:    #72256B;
  --plum-d:  #5a1b54;
  --plum-l:  rgba(114,37,107,0.10);
  --pine:    #105742;
  --pine-d:  #0c4332;
  --pine-l:  rgba(16,87,66,0.10);
  --euca:    #6CA07A;
  --euca-l:  rgba(108,160,122,0.18);
  --sage:    #CDDFD7;
  --cream:   #FFFAEB;
  --border:  rgba(114,37,107,0.14);
  --sw:      272px;
}

/* ── Sidebar ── */
.sidebar{
  width:var(--sw);
  background:var(--pine);
  display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;
  color:#fff;
  position:relative;
}
/* decorative top stripe */
.sidebar::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--plum),var(--euca));
}

/* ── Sidebar Header ── */
.s-top{
  padding:22px 18px 16px;
  border-bottom:1px solid rgba(255,255,255,0.12);
}
.s-logo-wrap{display:block;margin-bottom:10px;cursor:pointer}
.s-logo-img{height:28px;width:auto;display:block;filter:brightness(0) invert(1);opacity:0.96}
.s-tagline{
  font-size:10.5px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;
  color:rgba(255,255,255,0.5);margin-top:2px;
}
/* >>> arrow accent */
.s-arrow{
  font-size:11px;font-weight:900;color:var(--euca);letter-spacing:-1px;margin-right:4px;
}

/* ── New Btn ── */
.new-btn{
  margin:10px 10px 4px;display:flex;align-items:center;gap:8px;
  padding:9px 14px;
  background:rgba(255,255,255,0.10);
  border:1px solid rgba(255,255,255,0.20);
  border-radius:6px;color:#fff;font-size:13px;font-weight:700;
  letter-spacing:0.3px;cursor:pointer;transition:background .15s;
  width:calc(100% - 20px);font-family:inherit;
}
.new-btn:hover{background:rgba(255,255,255,0.20)}
.new-btn-plus{
  width:20px;height:20px;border-radius:50%;
  background:var(--plum);display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:300;line-height:1;flex-shrink:0;
}

/* ── Tree ── */
.tree{flex:1;overflow-y:auto;padding:6px 0 12px}
.tree::-webkit-scrollbar{width:4px}
.tree::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:2px}

.t-section{margin-bottom:2px}
.t-head{
  display:flex;align-items:center;padding:7px 14px;cursor:pointer;
  color:rgba(255,255,255,0.5);font-size:10.5px;font-weight:800;
  letter-spacing:1.2px;text-transform:uppercase;gap:6px;
  user-select:none;transition:color .15s;
}
.t-head:hover{color:#fff;background:rgba(255,255,255,0.06)}
.t-chevron{font-size:8px;margin-left:auto;transition:transform .2s}
.t-section.open .t-chevron{transform:rotate(90deg)}
.t-body{display:none}
.t-section.open .t-body{display:block}
.t-count{font-size:10px;background:rgba(255,255,255,0.12);padding:1px 7px;border-radius:9px;margin-left:2px}

.t-month{padding:6px 16px 2px;color:rgba(255,255,255,0.3);font-size:10.5px;font-weight:700;letter-spacing:0.5px}
.t-item{
  display:flex;align-items:center;padding:7px 10px 7px 18px;
  cursor:pointer;gap:7px;border-radius:5px;margin:1px 6px;
  transition:background .1s;color:rgba(255,255,255,0.78);font-size:12.5px;
  border-left:2px solid transparent;
}
.t-item:hover{background:rgba(255,255,255,0.08);color:#fff}
.t-item.active{background:rgba(255,255,255,0.14);color:#fff;border-left-color:var(--euca)}
.t-item-text{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-item-sub{font-size:11px;color:rgba(255,255,255,0.42);display:block;margin-top:1px}

.badge{font-size:10px;padding:2px 7px;border-radius:10px;flex-shrink:0;font-weight:700}
.b-pending{background:rgba(249,171,0,0.25);color:#ffd54f}
.pri-urgent{display:inline-flex;align-items:center;gap:5px;font-weight:700;color:#c0392b}.pri-urgent::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#e74c3c;flex-shrink:0}
.pri-normal{display:inline-flex;align-items:center;gap:5px;font-weight:700;color:#b7860b}.pri-normal::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#f0a500;flex-shrink:0}
.pri-low{display:inline-flex;align-items:center;gap:5px;font-weight:700;color:#27ae60}.pri-low::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#2ecc71;flex-shrink:0}
.b-approved{background:rgba(108,160,122,0.35);color:#a5d6b0}
.b-complete{background:rgba(114,37,107,0.30);color:#cf98ca}

/* ── Sidebar Bottom ── */
.s-bottom{padding:8px 10px;border-top:1px solid rgba(255,255,255,0.1)}

/* ── Main ── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}

/* ── Main Header ── */
.m-header{
  height:54px;
  background:#fff;
  border-bottom:3px solid var(--sage);
  display:flex;align-items:center;padding:0 24px;gap:12px;flex-shrink:0;
  position:relative;
}
.m-header::after{
  content:'';position:absolute;bottom:-3px;left:0;width:80px;height:3px;
  background:var(--plum);
}
.m-title{font-size:14px;font-weight:800;color:var(--plum);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:0.2px;text-transform:uppercase}
.h-actions{display:flex;gap:8px;align-items:center;flex-shrink:0}

/* ── Content ── */
.content{flex:1;overflow-y:auto;padding:24px;background:var(--cream)}
.content::-webkit-scrollbar{width:6px}
.content::-webkit-scrollbar-thumb{background:var(--sage);border-radius:3px}

/* ── Card ── */
.card{
  background:#fff;border:1px solid rgba(114,37,107,0.10);
  border-top:3px solid var(--plum);
  border-radius:8px;padding:28px 30px;max-width:840px;margin:0 auto;
  box-shadow:0 2px 12px rgba(114,37,107,0.07);
}

/* ── Doc Header ── */
.doc-hdr{
  display:flex;justify-content:space-between;align-items:flex-start;
  margin-bottom:22px;padding-bottom:16px;
  border-bottom:2px solid var(--sage);
  position:relative;
}
.doc-hdr::after{
  content:'>>> ';
  position:absolute;bottom:-2px;left:0;
  font-size:13px;font-weight:900;color:var(--plum);letter-spacing:-1px;
}
.doc-co{font-size:10px;font-weight:900;letter-spacing:3px;color:var(--plum);margin-bottom:6px;text-transform:uppercase}
.doc-title{font-size:20px;font-weight:900;color:var(--pine);letter-spacing:-0.5px;font-family:'Arial Black','Arial',sans-serif}
.doc-en{font-size:11px;color:#888;margin-top:3px}
.doc-meta{font-size:11px;color:#6b4f68;text-align:right;line-height:1.9}
.doc-meta strong{color:var(--plum)}

/* ── Form Tabs ── */
.f-tabs{display:flex;border-bottom:2px solid var(--sage);margin-bottom:22px}
.f-tab{
  padding:9px 22px;cursor:pointer;font-size:12.5px;font-weight:700;
  color:#888;border-bottom:2.5px solid transparent;margin-bottom:-2px;
  transition:all .15s;letter-spacing:0.3px;text-transform:uppercase;
}
.f-tab:hover{color:var(--plum)}
.f-tab.active{color:var(--plum);border-bottom-color:var(--plum)}

/* ── Section Title ── */
.sec{
  font-size:11px;font-weight:900;color:var(--pine);
  margin:22px 0 12px;padding:6px 10px 6px 12px;
  border-left:3px solid var(--plum);background:var(--pine-l);
  display:flex;align-items:center;gap:6px;letter-spacing:0.5px;text-transform:uppercase;
  border-radius:0 4px 4px 0;
}
.sec-arrow{color:var(--plum);font-weight:900;font-size:11px;letter-spacing:-1px}

/* ── Grid ── */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.s2{grid-column:span 2}
.s3{grid-column:span 3}

/* ── Fields ── */
.fg{display:flex;flex-direction:column;gap:5px}
.fl{font-size:11.5px;font-weight:700;color:var(--pine);letter-spacing:0.3px;text-transform:uppercase}
.fl.req::after{content:' *';color:var(--plum)}
.fi{
  padding:8px 12px;border:1.5px solid var(--sage);border-radius:5px;
  font-size:13px;color:#1a0d18;outline:none;transition:border-color .15s;
  font-family:inherit;background:#fff;width:100%;
}
.fi:focus{border-color:var(--plum);box-shadow:0 0 0 3px rgba(114,37,107,0.09)}
select.fi{cursor:pointer}
textarea.fi{resize:vertical;min-height:82px}

/* ── Parts Table ── */
.pt-wrap{overflow-x:auto;margin-top:4px}
.pt{width:100%;border-collapse:collapse;font-size:12.5px}
.pt th{
  background:var(--pine-l);padding:7px 10px;text-align:left;
  font-weight:800;color:var(--pine);border:1px solid var(--sage);
  font-size:11px;white-space:nowrap;text-transform:uppercase;letter-spacing:0.3px;
}
.pt td{padding:5px 8px;border:1px solid var(--sage);vertical-align:middle}
.pt td input,.pt td select{width:100%;border:none;outline:none;padding:3px 4px;font-size:12.5px;background:transparent;font-family:inherit}
.pt td input:focus,.pt td select:focus{background:#f8f0ff;border-radius:3px}
.add-row{
  margin-top:8px;padding:5px 14px;font-size:12px;
  background:#fff;border:1.5px dashed var(--sage);border-radius:5px;
  cursor:pointer;color:#888;transition:all .15s;font-family:inherit;font-weight:600;
}
.add-row:hover{background:var(--plum-l);border-color:var(--plum);color:var(--plum)}

/* ── Facility Check ── */
.fac-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.fac-item{
  display:flex;align-items:center;gap:8px;padding:8px 12px;
  border:1.5px solid var(--sage);border-radius:5px;font-size:12.5px;background:#fff;overflow:hidden;
}
.fac-item label{flex:1;font-weight:600;color:var(--pine);min-width:0;overflow:hidden;text-overflow:ellipsis}
.rg{display:flex;gap:10px;flex-shrink:0}
.rg label{display:flex;align-items:center;gap:4px;cursor:pointer;font-size:12.5px;font-weight:500;color:#555;white-space:nowrap}
/* ── Pre-treatment radio layout ── */
.rg-pre{display:flex;gap:18px;align-items:center;margin-bottom:4px}
.rg-lbl{display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap;font-size:13px;font-weight:500;color:#333}
.rg-lbl input[type="radio"]{width:15px;height:15px;flex-shrink:0;cursor:pointer;accent-color:var(--pine)}
.rg-lbl span{line-height:1}

/* ── Signature ── */
.sig-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:8px}
.sig-box{border:1.5px solid var(--sage);border-radius:6px;padding:14px;background:#fafffe}
.sig-ttl{font-weight:800;font-size:11px;color:var(--pine);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px}
.sig-line{border-bottom:1px solid #bbb;margin-top:26px;padding-bottom:2px;font-size:11px;color:#888;text-align:right}

/* ── Form Actions ── */
.f-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px;padding-top:20px;border-top:2px solid var(--sage)}

/* ── Buttons ── */
.btn{padding:9px 20px;border-radius:5px;font-size:12.5px;font-weight:800;cursor:pointer;border:none;transition:all .15s;font-family:inherit;display:inline-flex;align-items:center;gap:6px;letter-spacing:0.3px;text-transform:uppercase}
.btn-primary{background:var(--plum);color:#fff}
.btn-primary:hover{background:var(--plum-d)}
.btn-secondary{background:#f5f0f5;color:var(--plum);border:1.5px solid rgba(114,37,107,0.2)}
.btn-secondary:hover{background:var(--plum-l)}
.btn-pine{background:var(--pine);color:#fff}
.btn-pine:hover{background:var(--pine-d)}
.btn-warning{background:#c4700f;color:#fff}
.btn-danger{background:#c0392b;color:#fff;padding:6px 12px;font-size:11px}
.btn-sm{padding:5px 12px;font-size:11.5px}

/* ── Status Badge ── */
.sb{display:inline-block;padding:3px 11px;border-radius:12px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:0.5px}
.sb-pending{background:#fff3cd;color:#856404}
.sb-approved{background:var(--euca-l);color:var(--pine)}
.sb-complete{background:var(--plum-l);color:var(--plum)}

/* ── Detail View ── */
.d-row{display:flex;gap:8px;padding:9px 0;border-bottom:1px solid var(--sage);font-size:13px}
.d-lbl{color:var(--pine);min-width:140px;font-size:11px;font-weight:800;flex-shrink:0;text-transform:uppercase;letter-spacing:0.3px;padding-top:1px}
.d-val{color:#1a0d18;font-weight:500;line-height:1.5}
.d-val pre{font-family:inherit;white-space:pre-wrap;line-height:1.6}

/* ── Dashboard Cards ── */
.dash-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:840px;margin:20px auto 0}
.dash-card{
  background:#fff;border:1px solid rgba(114,37,107,0.10);
  border-top:3px solid var(--plum);border-radius:8px;padding:20px;
  box-shadow:0 2px 8px rgba(114,37,107,0.06);
}
.dash-icon{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:10px;background:var(--pine-l);margin-bottom:12px;color:var(--pine)}
.dash-num{font-size:26px;font-weight:900;color:var(--plum);font-family:'Arial Black','Arial',sans-serif}
.dash-lbl{font-size:11px;color:var(--pine);margin-top:3px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px}
.dash-sub{font-size:12px;color:#888;margin-top:4px}

/* ── Welcome Hero ── */
.welcome-hero{
  background:linear-gradient(135deg,var(--pine) 0%,#1a7a58 60%,#2d8f6a 100%);
  border-radius:8px;padding:32px 36px;margin:0 auto 20px;max-width:840px;
  position:relative;overflow:hidden;
}
.welcome-hero::before{
  content:'>>>';position:absolute;right:24px;top:50%;transform:translateY(-50%);
  font-size:72px;font-weight:900;color:rgba(255,255,255,0.06);letter-spacing:-6px;
  font-family:'Arial Black','Arial',sans-serif;pointer-events:none;
}
.welcome-hero::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--plum),var(--euca),transparent);
}
.wh-title{font-size:22px;font-weight:900;color:#fff;letter-spacing:-0.5px;margin-bottom:8px;font-family:'Arial Black','Arial',sans-serif}
.wh-sub{font-size:13px;color:rgba(255,255,255,0.7);margin-bottom:20px;line-height:1.6}
.wh-btns{display:flex;gap:12px;flex-wrap:wrap}
.wh-btn{
  padding:10px 22px;border-radius:5px;font-size:12.5px;font-weight:800;
  cursor:pointer;border:none;transition:all .15s;font-family:inherit;
  letter-spacing:0.5px;text-transform:uppercase;
  display:inline-flex;align-items:center;gap:7px;
}
.wh-btn-primary{background:var(--plum);color:#fff}
.wh-btn-primary:hover{background:var(--plum-d)}
.wh-btn-secondary{background:rgba(255,255,255,0.15);color:#fff;border:1.5px solid rgba(255,255,255,0.3)}
.wh-btn-secondary:hover{background:rgba(255,255,255,0.25)}

/* ── Setup Banner ── */
.setup-banner{
  background:#fff8e1;border:1.5px solid #ffe082;border-left:3px solid #f9ab00;
  border-radius:6px;padding:11px 16px;margin:0 auto 16px;
  display:flex;align-items:center;gap:10px;font-size:12.5px;color:#5f4b00;
  max-width:840px;
}

/* ── Modal ── */
.overlay{display:none;position:fixed;inset:0;background:rgba(16,87,66,0.35);z-index:1000;align-items:center;justify-content:center}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:8px;border-top:3px solid var(--plum);padding:28px;width:500px;max-width:95vw;box-shadow:0 12px 40px rgba(114,37,107,0.18)}
.modal-title{font-size:14px;font-weight:900;color:var(--plum);margin-bottom:20px;text-transform:uppercase;letter-spacing:0.5px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}
.modal-note{font-size:11px;color:#888;margin-top:5px;line-height:1.5}

/* ── Divider ── */
.divider{height:1px;background:linear-gradient(90deg,var(--plum),var(--sage),transparent);margin:20px 0;opacity:0.4}

/* ── Toast ── */
.toasts{position:fixed;bottom:24px;right:24px;z-index:2000;display:flex;flex-direction:column;gap:8px}
.toast{padding:11px 18px;border-radius:6px;border-left:3px solid rgba(255,255,255,0.4);font-size:13px;font-weight:600;color:#fff;box-shadow:0 4px 16px rgba(0,0,0,0.15);animation:tin .3s ease;max-width:340px;display:flex;align-items:center;gap:8px}
.t-success{background:var(--pine)}
.t-error{background:#c0392b}
.t-info{background:var(--plum)}
@keyframes tin{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}

/* ── Print ── */
@media print{
  .sidebar,.m-header,.f-actions,.setup-banner,.s-bottom,.h-actions,.f-tabs,.welcome-hero,.dash-grid{display:none!important}
  body{overflow:visible;display:block}
  .main{overflow:visible}
  .content{overflow:visible;padding:0;background:#fff}
  .card{box-shadow:none;border:none;padding:0;max-width:100%}
}
</style>
</head>
<body>

<!-- ════ SIDEBAR ════ -->
<aside class="sidebar">

<script>
// ══════════════════════════════════════════════════════
//  DATA LAYER
// ══════════════════════════════════════════════════════
const Store = {
  _key: 'vantive_records',
  _cfg: 'vantive_config',
  records() { return JSON.parse(localStorage.getItem(this._key) || '[]'); },
  config()  { return JSON.parse(localStorage.getItem(this._cfg) || '{}'); },
  saveRecords(r) { localStorage.setItem(this._key, JSON.stringify(r)); },
  saveConfig(c)  { localStorage.setItem(this._cfg, JSON.stringify(c)); },
  add(record) { const r=this.records(); r.push(record); this.saveRecords(r); },
  update(id, patch) { const r=this.records(); const i=r.findIndex(x=>x.id===id); if(i>=0){Object.assign(r[i],patch);this.saveRecords(r);} },
  remove(id) { this.saveRecords(this.records().filter(x=>x.id!==id)); },
  nextId(type) {
    const prefix = type==='work_order'?'WO':'SC';
    const d = new Date();
    const ymd = `${d.getFullYear()}${p2(d.getMonth()+1)}${p2(d.getDate())}`;
    const count = this.records().filter(r=>r.type===type).length+1;
    return `${prefix}-${ymd}-${String(count).padStart(3,'0')}`;
  }
};

function p2(n){ return String(n).padStart(2,'0'); }
function today(){ const d=new Date(); return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`; }
function fmtDt(iso){ return new Date(iso).toLocaleString('ko-KR'); }
function statusLabel(s){ return {pending:'대기',approved:'승인',complete:'완료'}[s]||s; }
const worktypeMap = {maintenance:'정기점검',repair:'수리',install:'설치',removal:'철수',other:'기타'};
const priorityMap = {urgent:'<span class="pri-urgent">긴급</span>',normal:'<span class="pri-normal">일반</span>',low:'<span class="pri-low">낮음</span>'};

// ── Form helpers ──────────────────────────────────────
function gv(id){ const el=document.getElementById(id); return el?el.value.trim():''; }
function getRadio(name){ const el=document.querySelector(`input[name="${name}"]:checked`); return el?el.value:''; }

function facilityBlock(){
  const items=[
    ['전압 및 전력 설비 용량','fac_elec'],['원수의 양 및 알력','fac_water'],
    ['정수실 동파 대비 설비','fac_freeze'],['정수실 배수관','fac_drain'],
    ['정수실 방수 설비','fac_waterproof'],['사용자 교육 사항','fac_edu'],
  ];
  return `<div class="fac-grid">${items.map(([lbl,nm])=>`
    <div class="fac-item"><label>${lbl}</label>
      <div class="rg">
        <label><input type="radio" name="${nm}" value="양호"> 양호</label>
        <label><input type="radio" name="${nm}" value="보완요구"> 보완요구</label>
      </div></div>`).join('')}</div>`;
}
function collectFacility(){
  const names=['fac_elec','fac_water','fac_freeze','fac_drain','fac_waterproof','fac_edu'];
  const obj={};
  names.forEach(n=>obj[n]=getRadio(n));
  return obj;
}
function collectParts(){
  const parts=[];
  document.querySelectorAll('#partsBody tr').forEach(tr=>{
    const inputs=tr.querySelectorAll('input');
    const sel=tr.querySelector('select');
    const code=inputs[0]?.value.trim(), desc=inputs[1]?.value.trim();
    if(code||desc) parts.push({code,desc,lot:inputs[2]?.value.trim(),qty:inputs[3]?.value,billable:sel?.value||'N'});
  });
  return parts;
}
let _pn=5;
function addPartsRow(){
  _pn++;
  const tbody=document.getElementById('partsBody');
  if(!tbody)return;
  const tr=document.createElement('tr');
  tr.innerHTML=`<td style="text-align:center;color:#999;font-size:12px">${_pn}</td>
    <td><input type="text" placeholder="제품코드"></td><td><input type="text" placeholder="부품명/설명"></td>
    <td><input type="text" placeholder="Lot/Batch No."></td>
    <td><input type="number" min="0" placeholder="0" style="width:56px"></td>
    <td style="text-align:center"><select style="width:62px;border:none;font-size:12px;background:transparent"><option>Y</option><option>N</option></select></td>`;
  tbody.appendChild(tr);
}
function partsRows(n){
  return Array.from({length:n},(_,i)=>`<tr>
    <td style="text-align:center;color:#999;font-size:12px">${i+1}</td>
    <td><input type="text" placeholder="제품코드"></td><td><input type="text" placeholder="부품명/설명"></td>
    <td><input type="text" placeholder="Lot/Batch No."></td>
    <td><input type="number" min="0" placeholder="0" style="width:56px"></td>
    <td style="text-align:center"><select style="width:62px;border:none;font-size:12px;background:transparent"><option>Y</option><option>N</option></select></td></tr>`).join('');
}

// ══════════════════════════════════════════════════════
//  UI CONTROLLER
// ══════════════════════════════════════════════════════
const UI = {
  currentType: 'work_order',
  currentId: null,

  renderTree() {
    const recs=Store.records();
    const woRecs=recs.filter(r=>r.type==='work_order');
    const scRecs=recs.filter(r=>r.type==='service_confirm');
    const id=this.currentId;
    const groupByMonth=arr=>{
      const g={};
      arr.forEach(r=>{const d=new Date(r.createdAt);const k=`${d.getFullYear()}년 ${d.getMonth()+1}월`;(g[k]||(g[k]=[])).push(r);});
      return g;
    };
    const renderSection=(title,icon,recs,type)=>{
      const groups=groupByMonth(recs);
      const isOpen=recs.some(r=>r.id===id)||recs.length===0;
      return `<div class="t-section ${isOpen?'open':''}" onclick="UI.toggleSection(this)" data-type="${type}">
        <div class="t-head">
          <span>${icon}</span><span>${title}</span>
          <span class="t-count">${recs.length}</span>
          <span class="t-chevron">▶</span>
        </div>
        <div class="t-body">
          ${Object.keys(groups).length===0
            ?'<div style="padding:6px 20px;font-size:11px;color:rgba(255,255,255,0.3);font-style:italic">등록된 내역 없음</div>'
            :Object.entries(groups).reverse().map(([month,recs])=>`
                <div class="t-month">${month}</div>
                ${[...recs].reverse().map(r=>`
                  <div class="t-item ${r.id===id?'active':''}" onclick="UI.viewRecord('${r.id}');event.stopPropagation()">
                    <span style="font-size:10px">${r.type==='work_order'?'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>':'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>'}</span>
                    <span class="t-item-text">${r.id}<span class="t-item-sub">${r.hospital||''}</span></span>
                    <span class="badge b-${r.status}">${statusLabel(r.status)}</span>
                  </div>`).join('')}`).join('')
          }
        </div>
      </div>`;
    };
    document.getElementById('tree').innerHTML=
      renderSection('작업 의뢰서','',woRecs,'work_order')+
      renderSection('서비스 확인서','',scRecs,'service_confirm');
  },

  toggleSection(el){ el.classList.toggle('open'); },

    document.getElementById('mTitle').textContent='외주작업 관리 시스템';

        <div class="wh-title">Vantive 외주작업 관리 시스템</div>
        <div class="wh-sub">외주 작업 의뢰서 및 서비스 확인서를 작성하고 제출하면<br>Google Sheets에 자동 기록되고 승인 이메일이 발송됩니다.</div>

      </div>
      <div class="dash-grid">
        <div class="dash-card"><div class="dash-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></div><div class="dash-num">${recs.filter(r=>r.type==='work_order').length}</div><div class="dash-lbl">총 작업 의뢰</div><div class="dash-sub">대기 ${recs.filter(r=>r.type==='work_order'&&r.status==='pending').length}건</div></div>
        <div class="dash-card"><div class="dash-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></div><div class="dash-num">${recs.filter(r=>r.type==='service_confirm').length}</div><div class="dash-lbl">서비스 확인서</div><div class="dash-sub">완료 ${recs.filter(r=>r.status==='complete').length}건</div></div>
        <div class="dash-card"><div class="dash-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></div><div class="dash-num">${recs.filter(r=>r.status==='pending').length}</div><div class="dash-lbl">승인 대기</div><div class="dash-sub">검토 필요</div></div>
      </div>`;
    this.renderTree();
  },

  showForm(type){
    type=type||this.currentType||'work_order';
    this.currentType=type; this.currentId=null;
    const cfg=Store.config(); const co=cfg.company||'VANTIVE'; const t=today();
    document.getElementById('mTitle').textContent=type==='work_order'?'작업 의뢰서 작성':'서비스 확인서 작성';
    document.getElementById('hActions').innerHTML=`<button class="btn btn-secondary btn-sm" onclick="UI.showWelcome()">← 홈으로</button>`;
    document.getElementById('content').innerHTML=`
    <div class="card">
      <div class="doc-hdr">
        <div>
          <div class="doc-co">${co}</div>
          <div class="doc-title">${type==='work_order'?'외주 작업 의뢰서':'서비스 확인서'}</div>
          <div class="doc-en">${type==='work_order'?'Work Order Request':'Customer Acknowledgement Form (VKR-TS-022)'}</div>
        </div>
        <div class="doc-meta">
          <div><strong>VANTIVE CONFIDENTIAL</strong> — INTERNAL</div>
          <div>DATE: ${t}</div>
          <div>TYPE: ${type==='work_order'?'WO':'SC'}</div>
        </div>
      </div>
      <div class="f-tabs">
        <div class="f-tab ${type==='work_order'?'active':''}" onclick="UI.showForm('work_order')"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:5px"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>작업 의뢰서</div>
        <div class="f-tab ${type==='service_confirm'?'active':''}" onclick="UI.showForm('service_confirm')"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:5px"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>서비스 확인서</div>
      </div>
      <form id="mainForm" onsubmit="return false">
        ${type==='work_order'?workOrderFormHtml():serviceConfirmFormHtml()}
        <div class="f-actions">
          <button type="button" class="btn btn-secondary" onclick="window.print()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:5px"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>인쇄</button>
          <button type="button" class="btn btn-primary" onclick="UI.submitForm()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:5px"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>제출 및 승인 이메일 발송</button>
        </div>
      </form>
    </div>`;
  },

  async submitForm(){
    const type=this.currentType;
    let data;
    try{ data=this._collectData(type); }
    catch(e){ toast(e.message,'error'); return; }
    Store.add(data); this.currentId=data.id; this.renderTree();
    const cfg=Store.config();
    if(cfg.gasUrl){
      toast('Google Sheets에 저장 중…','info');
      try{ await this._sendToGAS({...data,approverEmail:cfg.approverEmail}); toast('제출 완료! 승인 이메일이 발송되었습니다.','success'); }
      catch(e){ toast('GAS 연결 오류. 로컬에는 저장되었습니다.','error'); }
    } else { toast('로컬에 저장되었습니다. (Google Sheets 미연동)','info'); }
    this.viewRecord(data.id);
  },

  _collectData(type){
    const id=Store.nextId(type);
    const base={id,type,status:'pending',createdAt:new Date().toISOString()};
    if(type==='work_order'){
      ['f_date','f_requester','f_hospital','f_equipment','f_description','f_vendor'].forEach(k=>{ if(!gv(k))throw new Error('필수 항목(*)을 모두 입력해주세요.'); });
      return {...base,date:gv('f_date'),requester:gv('f_requester'),priority:gv('f_priority'),worktype:gv('f_worktype'),hospital:gv('f_hospital'),workdate:gv('f_workdate'),equipment:gv('f_equipment'),serial:gv('f_serial'),description:gv('f_description'),vendor:gv('f_vendor'),vendor_contact:gv('f_vendor_contact'),vendor_phone:gv('f_vendor_phone'),notes:gv('f_notes')};
    } else {
      ['f_hospital','f_equipment','f_repair'].forEach(k=>{ if(!gv(k))throw new Error('필수 항목(*)을 모두 입력해주세요.'); });
      return {...base,hospital:gv('f_hospital'),date:gv('f_date'),equipment:gv('f_equipment'),serial:gv('f_serial'),model:gv('f_model'),labor:gv('f_labor'),repair:gv('f_repair'),comments:gv('f_comments'),engineer:gv('f_engineer'),cust_signer:gv('f_cust_signer'),facility:collectFacility(),hw_raw:getRadio('hw_raw'),hw_soft:getRadio('hw_soft'),cl_raw:getRadio('cl_raw'),cl_carbon:getRadio('cl_carbon'),parts:collectParts()};
    }
  },

  async _sendToGAS(data){
    await fetch(Store.config().gasUrl,{method:'POST',mode:'no-cors',body:JSON.stringify(data),headers:{'Content-Type':'application/json'}});
  },

  viewRecord(id){
    const rec=Store.records().find(r=>r.id===id);
    if(!rec)return;
    this.currentId=id;
    const isWO=rec.type==='work_order';
    const typeLabel=isWO?'작업 의뢰서':'서비스 확인서';
    const cfg=Store.config();
    document.getElementById('mTitle').textContent=`${typeLabel} — ${id}`;
    document.getElementById('hActions').innerHTML=`
      <span class="sb sb-${rec.status}">${statusLabel(rec.status)}</span>
      ${rec.status==='pending'?`<button class="btn btn-pine btn-sm" onclick="UI.setStatus('${id}','approved')"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:4px"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>승인</button>`:''}
      ${rec.status==='approved'?`<button class="btn btn-warning btn-sm" onclick="UI.setStatus('${id}','complete')"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:4px"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>완료</button>`:''}
      <button class="btn btn-secondary btn-sm" onclick="window.print()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg></button>
      <button class="btn btn-danger" onclick="UI.deleteRecord('${id}')">삭제</button>`;

    let body='';
    if(isWO){
      body=`<div class="sec"><span class="sec-arrow">>></span> 의뢰 기본 정보</div>
      ${dr('의뢰 번호',rec.id)}${dr('의뢰일',rec.date)}${dr('담당자',rec.requester)}
      ${dr('우선순위',priorityMap[rec.priority]||rec.priority,true)}${dr('작업 유형',worktypeMap[rec.worktype]||rec.worktype)}
      ${dr('등록 일시',fmtDt(rec.createdAt))}
      <div class="sec"><span class="sec-arrow">>></span> 고객 및 장비 정보</div>
      ${dr('병원명',rec.hospital)}${dr('예상 작업일',rec.workdate||'-')}
      ${dr('장비명',rec.equipment)}${dr('장비 S/N',rec.serial||'-')}
      ${dr('작업 내용',`<pre>${rec.description}</pre>`,true)}
      <div class="sec"><span class="sec-arrow">>></span> 외주 업체</div>
      ${dr('업체명',rec.vendor)}${dr('담당자',rec.vendor_contact||'-')}${dr('연락처',rec.vendor_phone||'-')}
      ${rec.notes?dr('특이사항',`<pre>${rec.notes}</pre>`,true):''}`;
    } else {
      const facNames={fac_elec:'전압·전력 설비',fac_water:'원수 양·압력',fac_freeze:'동파 대비 설비',fac_drain:'배수관',fac_waterproof:'방수 설비',fac_edu:'사용자 교육'};
      const facRows=Object.entries(rec.facility||{}).map(([k,v])=>dr(facNames[k]||k,v||'-')).join('');
      const partsTbl=(rec.parts||[]).length>0?`
        <table class="pt" style="margin-top:8px">
          <thead><tr><th>#</th><th>Product Code</th><th>Item Description</th><th>Lot/Batch No.</th><th>Qty</th><th>Billable</th></tr></thead>
          <tbody>${rec.parts.map((p,i)=>`<tr><td style="text-align:center">${i+1}</td><td>${p.code||'-'}</td><td>${p.desc||'-'}</td><td>${p.lot||'-'}</td><td>${p.qty||'-'}</td><td style="text-align:center">${p.billable}</td></tr>`).join('')}</tbody>
        </table>`:'<div style="color:#888;font-size:13px;padding:8px 0">사용 부품 없음</div>';
      body=`<div class="sec"><span class="sec-arrow">>></span> 서비스 기본 정보</div>
      ${dr('확인서 번호',rec.id)}${dr('병원명',rec.hospital)}${dr('서비스 날짜',rec.date)}
      ${dr('장비명',rec.equipment)}${dr('장비 S/N',rec.serial||'-')}${dr('Model',rec.model||'-')}
      ${dr('Labor Time',rec.labor?rec.labor+' 시간':'-')}${dr('수리 내역',`<pre>${rec.repair}</pre>`,true)}
      ${rec.comments?dr('Comments',`<pre>${rec.comments}</pre>`,true):''}
      <div class="sec"><span class="sec-arrow">>></span> 전처리 체크</div>
      ${dr('경도(Raw Water)',rec.hw_raw||'-')}${dr('경도(Softener)',rec.hw_soft||'-')}
      ${dr('염소(Raw Water)',rec.cl_raw||'-')}${dr('염소(Carbon)',rec.cl_carbon||'-')}
      <div class="sec"><span class="sec-arrow">>></span> 시설 점검</div>${facRows}
      <div class="sec"><span class="sec-arrow">>></span> 사용 부품 목록</div>${partsTbl}
      <div class="sec"><span class="sec-arrow">>></span> 서명</div>
      <div class="sig-grid">
        <div class="sig-box"><div class="sig-ttl">Vantive 엔지니어</div>
          <div style="margin-top:12px;font-size:15px;font-weight:800;color:var(--pine)">${rec.engineer||'-'}</div>
          <div class="sig-line">${rec.date}</div></div>
        <div class="sig-box"><div class="sig-ttl">고객 서명</div>
          <div style="margin-top:12px;font-size:15px;font-weight:800;color:var(--pine)">${rec.cust_signer||'-'}</div>
          <div class="sig-line">${rec.date}</div></div>
      </div>`;
    }
    const co=cfg.company||'VANTIVE';
    document.getElementById('content').innerHTML=`
    <div class="card">
      <div class="doc-hdr">
        <div><div class="doc-co">${co}</div><div class="doc-title">${typeLabel}</div><div class="doc-en">${rec.hospital||''}</div></div>
        <div class="doc-meta"><div><strong>${rec.id}</strong></div><div>등록: ${rec.date}</div><div>제출: ${fmtDt(rec.createdAt)}</div></div>
      </div>
      ${body}
      <div class="f-actions">
        <button class="btn btn-secondary" onclick="UI.showForm('${rec.type}')">같은 양식 새로 작성</button>
        ${cfg.gasUrl?`<button class="btn btn-primary" onclick="UI.resendEmail('${id}')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:5px"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>이메일 재발송</button>`:''}
      </div>
    </div>`;
    this.renderTree();
  },

  setStatus(id,status){Store.update(id,{status});this.viewRecord(id);toast(`상태: '${statusLabel(status)}'으로 변경되었습니다.`,'success');},
  deleteRecord(id){if(!confirm('이 레코드를 삭제하시겠습니까?'))return;Store.remove(id);this.showWelcome();toast('삭제되었습니다.','info');},
  async resendEmail(id){const rec=Store.records().find(r=>r.id===id);const cfg=Store.config();if(!rec||!cfg.gasUrl)return;try{await this._sendToGAS({...rec,approverEmail:cfg.approverEmail,resend:true});toast('이메일이 재발송되었습니다.','success');}catch(e){toast('이메일 발송 실패','error');}},

  showSettings(){const cfg=Store.config();document.getElementById('cfg_gas').value=cfg.gasUrl||'';document.getElementById('cfg_email').value=cfg.approverEmail||'';document.getElementById('cfg_company').value=cfg.company||'Vantive';document.getElementById('settingsOverlay').classList.add('open');},
  closeSettings(){document.getElementById('settingsOverlay').classList.remove('open');},
  saveSettings(){Store.saveConfig({gasUrl:document.getElementById('cfg_gas').value.trim(),approverEmail:document.getElementById('cfg_email').value.trim(),company:document.getElementById('cfg_company').value.trim()||'Vantive'});this.closeSettings();toast('설정이 저장되었습니다.','success');}
};

function dr(label,value,raw){
  return `<div class="d-row"><div class="d-lbl">${label}</div><div class="d-val">${raw?value:(value||'-')}</div></div>`;
}
function toast(msg,type='info'){
  const c=document.getElementById('toasts');const el=document.createElement('div');
  el.className=`toast t-${type}`;el.textContent=msg;c.appendChild(el);
  setTimeout(()=>el.remove(),4500);
}

document.getElementById('settingsOverlay').addEventListener('click',e=>{if(e.target===e.currentTarget)UI.closeSettings();});
UI.showWelcome();
</script>
</body>
</html>
